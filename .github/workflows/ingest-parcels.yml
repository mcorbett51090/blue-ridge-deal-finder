name: Ingest parcels

# ---------------------------------------------------------------------------
# CADENCE JUSTIFICATION — a TERMS requirement, not a politeness knob.
#
# GitHub's Additional Product Terms forbid using hosted runners for "any
# activity that places a burden on our servers... disproportionate to the
# benefits provided", and for work "unrelated to the production, testing,
# deployment, or publication of the software project associated with the
# repository". The stated penalty is "disabling of repositories".
#
# This job IS the publication path for this repo's own project, satisfying the
# relatedness test. Proportionality is satisfied by cadence:
#   - WEEKLY, not daily. County assessment rolls move on a multi-YEAR
#     reappraisal cycle; a daily pull of 500k parcels re-fetches data that is
#     identical 364 days in 365. Weekly is already generous.
#   - Incremental, per county, ~0.5 req/sec, concurrency 1.
#   - No unbounded historical backfill on hosted runners, ever.
#
# The restraint that keeps a county IT admin comfortable keeps GitHub
# comfortable. One rate posture, two audiences.
# ---------------------------------------------------------------------------
on:
  schedule:
    # 04:17 UTC Sundays — off-hour and off-:00 for the documented high-load drop.
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      counties:
        description: 'Comma-separated county names (blank = all NC targets)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ingest-parcels
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Gate family — must pass BEFORE any socket opens
        run: npm run verify

      # ⛔ WITHOUT THIS STEP THIS WORKFLOW CANNOT SUCCEED, AND FOR A WHILE
      # NEVER DID. data/warehouse/ is gitignored by design (ADR 0008) and the
      # runner is ephemeral, so the corpus arrived empty every scheduled run
      # and pipeline/store/warehouse.ts's assertPriorStateNotLost correctly
      # refused rather than publish a delta computed against nothing. The
      # guard was right; the missing half was a way to carry the corpus
      # between runs. See docs/decisions/0010-ci-warehouse-store.md.
      #
      # A PRIOR revision of this workflow tried `actions/cache` instead —
      # wrong, for the reason scripts/warehouse-remote.mjs's own header states:
      # cache entries are evicted after 7 days without a hit and the ingest
      # cadence IS 7 days, so the only copy of the corpus rode on a coin flip.
      # That revision also dropped the `npm run publish` step below, so even a
      # successful ingest would never have reached the site. See ADR 0010 for
      # the full history; this restores the release-asset design.
      - name: Restore the warehouse (release asset -> data/warehouse/)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/warehouse-remote.mjs restore

      - name: Ingest NC parcels
        id: ingest
        run: npm run ingest:parcels -- --counties="${{ inputs.counties }}"

      # Immediately after the ingest and BEFORE the publish, deliberately: the
      # corpus is the expensive, irreplaceable artifact and a later step
      # failing must not be what loses it. A no-op when the hash is unchanged.
      - name: Persist the warehouse (data/warehouse/ -> release asset)
        if: steps.ingest.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/warehouse-remote.mjs publish

      # ⛔ THE STEP THAT RAN IN NO WORKFLOW AT ALL. `npm run publish` is what
      # turns the warehouse into listings.json, coverage.json and status.json
      # — the Lane-1 rows and the freshness surface the site actually serves —
      # and deploy.yml only ever runs `astro build` over whatever JSON is
      # already committed. A scheduled ingest that never publishes moves
      # nothing a reader can see. It runs here, not in deploy.yml, because it
      # needs the warehouse, which exists only in this job; it is pure local
      # computation over data already on disk, so it adds nothing to the
      # cadence budget this workflow's header justifies.
      - name: Publish — warehouse in, site payload out
        if: steps.ingest.outcome == 'success'
        run: npm run publish

      # Conditioned on the INGEST, not on the publish. The event log and the
      # run manifest are true the moment the ingest returns, and they are the
      # only record that the run happened at all — check-freshness.mjs reads
      # exactly these. Losing them because a downstream projection failed
      # would erase the evidence of a good run; the job still reports the
      # publish step's own failure separately if it has one.
      - name: Commit event log, manifest + published surfaces
        if: steps.ingest.outcome == 'success'
        run: |
          git config user.name  "blue-ridge-bot"
          git config user.email "matt@ravenpower.net"
          git add data/events data/runs data/coverage.json \
                  publish/out site/src/data site/public/data
          git diff --staged --quiet || git commit -m "ingest(parcels): $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
