name: Ingest parcels

# ---------------------------------------------------------------------------
# CADENCE JUSTIFICATION — a TERMS requirement, not a politeness knob.
#
# GitHub's Additional Product Terms forbid using hosted runners for "any
# activity that places a burden on our servers... disproportionate to the
# benefits provided", and for work "unrelated to the production, testing,
# deployment, or publication of the software project associated with the
# repository". The stated penalty is "disabling of repositories".
#
# This job IS the publication path for this repo's own project, satisfying the
# relatedness test. Proportionality is satisfied by cadence:
#   - WEEKLY, not daily. County assessment rolls move on a multi-YEAR
#     reappraisal cycle; a daily pull of 500k parcels re-fetches data that is
#     identical 364 days in 365. Weekly is already generous.
#   - Incremental, per county, ~0.5 req/sec, concurrency 1.
#   - No unbounded historical backfill on hosted runners, ever.
#
# The restraint that keeps a county IT admin comfortable keeps GitHub
# comfortable. One rate posture, two audiences.
# ---------------------------------------------------------------------------
on:
  schedule:
    # 04:17 UTC Sundays — off-hour and off-:00 for the documented high-load drop.
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      counties:
        description: 'Comma-separated county names (blank = all NC targets)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ingest-parcels
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Gate family — must pass BEFORE any socket opens
        run: npm run verify

      # ⛔ WITHOUT THIS STEP THIS WORKFLOW CANNOT SUCCEED, AND NEVER HAS.
      # Measured: all three scheduled runs to date (32617980335, 33292578668,
      # 34011615287) died on `prior warehouse state is EMPTY but 6 run
      # manifest(s) exist` — the lost-state refusal in pipeline/store/warehouse.ts.
      # data/warehouse/ is gitignored by design and the runner is ephemeral, so
      # the corpus arrived empty every week and the guard correctly refused to
      # publish a delta computed against nothing. The guard was right; the
      # missing half was a way to carry the corpus between runs.
      - name: Restore the warehouse (release asset -> data/warehouse/)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/warehouse-remote.mjs restore

      - name: Ingest NC parcels
        id: ingest
        run: npm run ingest:parcels -- --counties="${{ inputs.counties }}"

      # Immediately after the ingest and BEFORE the publish, deliberately: the
      # corpus is the expensive, irreplaceable artifact and a later step failing
      # must not be what loses it. Skipped as a no-op when the hash is unchanged.
      - name: Persist the warehouse (data/warehouse/ -> release asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/warehouse-remote.mjs publish

      # ⛔ THE PUBLISH PATH RAN IN NO WORKFLOW AT ALL. `npm run publish` is what
      # turns the warehouse into listings.json, coverage.json and status.json —
      # the Lane-1 rows and the freshness surface the site actually serves — and
      # it appeared in none of the four workflow files. Deploy only ran
      # `astro build` over whatever JSON happened to be committed, so those
      # surfaces could only ever move when a human ran publish by hand. A
      # scheduled ingest that never publishes updates nothing a reader can see.
      #
      # It runs HERE rather than in deploy.yml because it needs the warehouse,
      # which exists only in this job. It is pure local computation over data
      # already on disk — no socket, so it adds nothing to the cadence budget.
      - name: Publish — warehouse in, site payload out
        run: npm run publish

      # Conditioned on the INGEST, not on the publish. The event log and the run
      # manifest are true the moment the ingest returns, and they are the only
      # record that the run happened at all — check-freshness.mjs reads exactly
      # these. Losing them because a downstream projection failed would erase the
      # evidence of a good run. The job still reports the publish failure.
      - name: Commit event log, manifest + published surfaces
        if: steps.ingest.outcome == 'success'
        run: |
          git config user.name  "blue-ridge-bot"
          git config user.email "matt@ravenpower.net"
          git add data/events data/runs data/coverage.json \
                  publish/out site/src/data site/public/data
          git diff --staged --quiet || git commit -m "ingest(parcels): $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
