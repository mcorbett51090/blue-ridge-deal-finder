# fixtures/gates/anchor-null-evidence.yaml
#
# THE P1 STATE OF THE NC ANCHOR, PRESERVED SO THE REFUSAL STAYS TESTED.
#
# P1 shipped this entry in sources/sources.yaml with both live-only digests null
# and `enabled: false`, and tests/guard.test.ts asserted that the registry guard
# refused it. P2 filled the digests from a live fetch and flipped `enabled: true`,
# which would have turned that test into a test of nothing — the classic shape
# where a fix silently deletes its own detector.
#
# So the state moved here instead of being deleted. The test now points at this
# fixture and still proves the MECHANISM: a source whose evidence has never been
# captured is refused with `incomplete-registry`, no matter how complete the rest
# of the entry looks. `evidence_sha256` and `schema_fingerprint` are NULLABLE in
# the zod schema (they cannot be authored offline) but REQUIRED by the guard —
# and this fixture is what proves the guard, not the schema, is what enforces it.
#
# ⛔ DO NOT "fix" this file by filling the digests in. Its whole value is that
# they are null.

- id: nc-onemap-parcels
  kind: arcgis-map-server
  url: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/MapServer/1
  legal_basis: public-records-open-data

  robots:
    verdict: allow
    checked_at: "2026-08-19"
    evidence_url: https://services.nconemap.gov/robots.txt
    evidence_sha256: null          # ← the point of the fixture

  tos:
    verdict: permissive
    checked_at: "2026-08-19"
    evidence_url: https://www.nconemap.gov/pages/terms

  rate:
    rps: 0.5
    concurrency: 1
    crawl_delay_s: null
    backoff: exponential

  user_agent: "blue-ridge-deal-finder/1.0 (+https://github.com/mcorbett51090/blue-ridge-deal-finder; matt@ravenpower.net)"

  control_block:
    positive:
      where: "cntyname='Watauga'"
      returnCountOnly: true
      expect_count: 47388
    negative:
      where: "cntyname='Zzzznotacounty'"
      returnCountOnly: true
      expect_count: 0

  expect:
    per_county_min_rows:
      Watauga: 45000
      Buncombe: 128000
      Henderson: 71000
      Haywood: 50000
      Jackson: 39000
      Ashe: 36000
      Transylvania: 30000
      Avery: 23000
      Madison: 20000
      Mitchell: 16500
      Yancey: 16500
    rolling_median_floor_pct: 50
    max_delta_pct: 5
    max_zero_parval_pct: 4

  schema_fingerprint: null         # ← the point of the fixture
  enabled: false
