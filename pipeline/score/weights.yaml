# The only tunables. pipeline/score/index.ts reads this file and nothing else
# reads it — a weight that lives in two places is a weight that disagrees with
# itself the first time one copy is edited.
#
# Nominal weights sum to 100. `effective_weight` = nominal × vintage_confidence
# × cohort_penalty, computed per row at score time, never edited here.
# ⛔ `per_acre` IS NOT HERE ANY MORE, and its absence is the whole point.
# It is the SELECTION axis (see `per_acre:` below, and `cheapness` in the
# published payload), and a signal cannot both choose the shortlist and grade
# it. Measured 2026-08-19: `publish` took topN by the composite while `per_acre`
# was the only signal firing, so the published slice was the top of the very
# axis it reported and all 500 scored rows tied at exactly 100. Substituting a
# different transform does not help — rank, log min–max and log median/IQR all
# discriminate across the corpus (distinct 101) and all saturate in their own
# top slice (1, 6, 1). See docs/probe-log.md.
components:
  # parval ÷ a price that ONLY for_sale_evidence can supply. There is no sale-
  # PRICE field among the 71 (TB2 §2, verified across the full field list), so
  # `discount` is permanently `unknown` for every Lane-2 row, by construction.
  discount: 38
  # Cited observations only, each with a source_url. Nothing model-inferred.
  distress: 31
  # USGS NHD geometry (E5.1-E5.3) — computed from GEOMETRY, never from text.
  water: 19
  # FEMA NFHL (E5.4), USGS EPQS (C31), Census TIGER/Line.
  livability: 12

# ---------------------------------------------------------------------------
# The rest of the tunables. Same rule as the weights: they live HERE and are
# read by pipeline/score/config.ts and by nothing else. A threshold that lives
# in two places disagrees with itself the first time one copy is edited.
# ---------------------------------------------------------------------------

per_acre:
  # <50 comparables in a (cntyfips, use-bucket, acreage-band) bucket -> `unknown`
  # (plan §5.4). A percentile out of 6 rows is a number, not a measurement.
  min_cohort: 50
  # Upper edges, in acres. A band is (previous, edge]; the last band is (500, inf).
  # Bucketing at all is what makes the percentile a comparison between LIKE
  # parcels — a 0.2-acre town lot and a 300-acre tract share no market.
  acreage_bands: [1, 5, 10, 25, 50, 100, 500]

discount:
  # Percentile INSIDE the cntyfips cohort (plan §5.2). Below this the cohort is
  # too thin to rank in and the absolute band is used, at a stated penalty.
  min_cohort: 30
  thin_cohort_penalty: 0.7
  # CONFIDENCE decay only. 1.00 @0y … 0.50 @8y. It NEVER touches the score:
  # a 5-year-old denominator is a less trustworthy MEASUREMENT, not a worse DEAL.
  vintage_decay_per_year: 0.0625
  # G.S. 105-286 caps the reappraisal cycle at 8 years, so a vintage outside
  # 0..8 is a bad join, not old data, and fails closed to `unknown`.
  max_vintage_years: 8

water:
  # plan §5.5 — computed from GEOMETRY. A listing adjective is not frontage.
  frontage_score: 100
  near_m: 100
  near_score: 70
  mid_m: 400
  mid_score: 40

distress:
  # plan §5.3 — additive, clamped 0..100, every increment needs a cited
  # observation with a source_url and an observed_at. Nothing model-inferred.
  increments:
    tax_sale_listed: 40
    foreclosure_notice: 35
    tax_delinquent: 30
    upset_bid_window_open: 15

vetoes:
  # ⛔ HARD VETOES, NOT DEDUCTIONS (plan §5.6). A deduction still competes; on
  # measured data the HOA commons win anyway. A naive `$/acre ASC` on the live
  # warehouse returned six Watauga rows at $100 for 10-134 acres, EVERY one
  # `parusedesc = 'EXCLUSIONS (COMMONE AREAS)'` — HOA common land sorting to
  # first place. None of it is purchasable at any price.
  #
  # Matched case-insensitively against the WHOLE parusedesc string. The upstream
  # typo 'COMMONE' is real and is matched defensively, along with the spelling
  # it was meant to be.
  use_class_patterns:
    - EXCLUSION
    - COMMON *E? *AREA
    - COMMONE
    - GOVERNMENT
    - CEMETER
    - RIGHT[- ]OF[- ]WAY
    # Abbreviations the SITUS ADDRESS actually uses. Measured 2026-08-19 from
    # real published rows, all of which scored 100 and none of which is buyable:
    #   "ROAD R/W SILVER SLIP", "R/W LAKE POINT DR"  -> R/W
    #   "BARBERRY HTS HOA-WELL LOT"                  -> HOA, WELL LOT
    - \bR/W\b
    - \bHOA\b
    - WELL LOT
    - OPEN SPACE
    - GREENBELT
    - DETENTION
  # A remnant strip is not a parcel anyone buys. Vetoed rows still carry their
  # score and their reason — they are removed from the RANKING, not silenced.
  min_acres: 0.1
