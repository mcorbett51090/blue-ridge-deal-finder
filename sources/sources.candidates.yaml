    rate: { rps: 0.5, concurrency: 1, crawl_delay_s: null, backoff: exponential }
    user_agent: "blue-ridge-deal-finder/1.0 (+https://github.com/mcorbett51090/blue-ridge-deal-finder; matt@ravenpower.net)"
    control_block:
      positive: { where: "cntyname='Watauga'", returnCountOnly: true, expect_count: 47388 }
