denied_by_p0:

  - host: "www.landsearch.com, landsearch.com"
    claim_ref: B35
    reason: >-
      Cloudflare managed challenge on EVERY content path including the 7 sitemaps its own
      robots.txt advertises. Response header `cf-mitigated: challenge`. HTTP 403 under the honest
      UA, the default curl UA and a browser UA alike. robots.txt (200/540 B) is the sole exempt
      path, which is exactly why a robots-only probe rated it GREEN.
    downgrade: "🟢 GREEN (B35) → 🔴 RED"
    probe_ref: "docs/probe-log.md §1"

  - host: "www.georgiapublicnotice.com"
    claim_ref: B8, B9
    reason: >-
      robots.txt ALLOWS our UA (0 of 31 named agents match; ClaudeBot positive control matches 1)
      — but /Terms-of-Use.aspx states verbatim: "You may not engage in any screen scraping,
      database scraping, or spidering ... or use of any other automated means to collect
      information from the site" and "You may not ... incorporate the content in any database,
      compilation, archive or cache." tos.verdict = PROHIBITIVE. ToS is the stricter instrument.
    downgrade: "🟡 YELLOW (B-scorecard) → 🔴 RED"
    probe_ref: "docs/probe-log.md §3"

  - host: "www.publicnoticevirginia.com"
    claim_ref: B12, B13
    reason: "Identical prohibitive Terms of Use to the Georgia site. Same vendor platform."
    downgrade: "🟡 YELLOW → 🔴 RED"
    probe_ref: "docs/probe-log.md §3"

  - host: "www.vapublicnotices.com"
    claim_ref: B12
    reason: "NXDOMAIN re-confirmed (curl exit 6). Never use."
    probe_ref: "docs/probe-log.md §3"

  - host: "qpublic.schneidercorp.com, beacon.schneidercorp.com, qpublic.net, gis.qpublic.net"
    claim_ref: E1.1-E1.4
    reason: >-
      PRE-COMMITTED KILL FIRED. Two independent grounds: (a) robots.txt itself carries
      `User-agent: * / Disallow: /Application.aspx` (+ case variants, /print.aspx, /renderpdf.aspx,
      /filedata/) — E1 did not record this; (b) every non-robots path returns HTTP 403 / ~5,798 B.
      The separate host gis.qpublic.net returns Cloudflare error 1016 (Origin DNS error, HTTP 530)
      — a dead origin, not a bot wall. CLOSED PERMANENTLY. Spend no further time.
    probe_ref: "docs/probe-log.md §5"

  - host: "vginmaps.vdem.virginia.gov"
    path: "/arcgis/, /Download/, /VGIN/, /websites/"
    claim_ref: A4, E3.5
    reason: >-
      Host is LIVE (ArcGIS 11.3, 9 folders, HTTP 200) but its robots.txt disallows /arcgis/ —
      the exact path the REST services live on. A4 recorded "fetched OK" and was silent on robots.
      Sibling host gismaps.vdem.virginia.gov is NXDOMAIN (E3.5 confirmed).
    probe_ref: "docs/probe-log.md §6"

