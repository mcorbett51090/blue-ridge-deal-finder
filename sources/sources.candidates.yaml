    covers: { states: [NC], counties: 11 }
    robots:
      verdict: allow
      checked_at: 2026-08-19
      evidence_url: https://services.nconemap.gov/robots.txt
      evidence_sha256: null            # ⚠️ not cached this phase — P1 must fetch before first use
