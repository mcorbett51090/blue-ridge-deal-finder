# ONLY sources that PASSED a P0 probe with a control block that could fail.
# Schema per plan.md §3.1. Nothing here is enabled: P1 must promote an entry into
# sources.yaml deliberately, after re-running its control_block.
#
# Every robots.txt body cited below is cached under sources/evidence/robots/ with the
# sha256 recorded on the entry. Full probe transcript: docs/probe-log.md.
#
# ⛔ Sources that FAILED P0 and belong in sources.denied.yaml are listed at the bottom of
#    this file under `denied_by_p0:` so the two lists cannot drift apart.

