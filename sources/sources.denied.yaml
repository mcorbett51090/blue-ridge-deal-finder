# sources/sources.denied.yaml — the do-not-fetch list (plan §3.2).
#
# THE DENYLIST WINS EVERY CONFLICT. pipeline/fetch/client.ts matches the request
# host and path against these rules BEFORE it reads anything from sources.yaml,
# and a match is a hard throw regardless of what the source entry claims —
# including `enabled: true`, including a `robots.verdict: allow`. A registry
# entry is an assertion by us; this file is an assertion by them.
#
# Every row carries a claim ref so the reason is auditable, not remembered.
# `host` matches the hostname exactly or as a suffix when written `*.example.com`.
# `paths` are path PREFIXES (case-insensitive); absent `paths` denies the host
# entirely.

- host: "*.craigslist.org"
  claims: [B39, B40, B41, B42]
  reason: >-
    Explicit ToS ban on automated access, $3,000/day liquidated damages, live
    403 confirmed twice, and Craigslist v. 3Taps is directly on point. Excluded
    outright — there is no "scrape it politely" version of this one.

- host: hudhomestore.gov
  claims: [B19]
  reason: "robots.txt is a blanket Disallow: /"

- host: realestatesales.gov
  claims: [B25]
  reason: "GSA — robots.txt is a blanket Disallow: /"

- host: auction.com
  paths: ["/foreclosures/", "/bank-owned/"]
  claims: [B29]
  reason: "robots.txt blocks exactly the two paths that carry the useful data"

- host: homesteps.com
  paths: ["/search/"]
  claims: [B22]
  reason: "robots.txt blocks the only useful path"

- host: forsalebyowner.com
  paths: ["/listing/", "/listings/", "/homes-for-sale/"]
  claims: [B37]
  reason: "robots.txt disallows exactly the listing paths"

- host: xome.com
