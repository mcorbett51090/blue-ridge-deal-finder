- host: qpublic.schneidercorp.com
  claims: [E1.1, E1.2, E1.3, E1.4]
  reason: >-
    Confirmed bot wall (E1.1–E1.4). Scraping it is a disconfirmed premise, not a
    hard problem — E1.2 proves UA spoofing would not have worked either.

