- host: search.gsccca.org
  claims: [A8, B43, B44, B45]
  reason: >-
    GA deeds require an account. OUR FETCHER NEVER AUTHENTICATES TO A THIRD-PARTY
    SITE — a login is precisely where the hiQ / Van Buren safe-harbour argument
    stops. This rule is about our conduct, not their robots.txt.

- host: gsccca.org
