# sources/sources.yaml — the allowlist of things this system may fetch.
#
# pipeline/fetch/client.ts refuses to open a socket for any source that does not
# carry EVERY field below. The schema is not documentation; it is the argument
# the fetcher checks before it is permitted to act (plan §3.1, §3.3 mech. 2).
#
# ✅ P2 STATE — the two live digests are filled in and the anchor is ENABLED.
# `robots.evidence_sha256` and `schema_fingerprint` are the only two fields that
# cannot be authored offline: both are digests of a LIVE response. P1 made no
# network call, so it left them `null` and the anchor `enabled: false` — the
# guard working, not a stub. P2 fetched both, cached the evidence under
# sources/evidence/, and flipped `enabled` in the same commit.
#
# The P1-state entry is preserved verbatim as fixtures/gates/anchor-null-evidence.yaml
# so tests/guard.test.ts still proves the refusal mechanism against a null-digest
# entry. Deleting the state did not delete the test for it.

- id: tn-property-boundaries
  # East Tennessee — an owner priority region. STRUCTURALLY THINNER THAN NC:
  # there is no assessed-value field anywhere in the 17 columns, so `discount`
  # and `per_acre` are permanently UNKNOWN for every TN row. `LINK_TPAD` points
  # at the state assessment system where value lives, but that hop failed its
  # own control at G3b and is deliberately not attempted here.
  kind: arcgis-feature-server
  role: attributes
  url: https://services1.arcgis.com/YuVBSS7Y1of2Qud1/arcgis/rest/services/Tennessee_Property_Boundaries_Public_Use/FeatureServer/0
  legal_basis: public-records-open-data
  robots:
    # HTTP 403, body "Invalid URL" (11 B) — the host serves no robots file at
    # this path. That is UNREACHABLE, not `allow`: nobody granted anything and
    # nobody refused. Recorded as its own verdict so the distinction survives.
    verdict: unreachable
    checked_at: "2026-08-19"
    evidence_url: https://services1.arcgis.com/robots.txt
    evidence_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  tos: { verdict: permissive, checked_at: "2026-08-19", evidence_url: https://www.tn.gov/finance/sts-gis.html }
  rate: { rps: 0.5, concurrency: 1, crawl_delay_s: null, backoff: exponential }
  user_agent: "blue-ridge-deal-finder/1.0 (+https://github.com/mcorbett51090/blue-ridge-deal-finder; matt@ravenpower.net)"
  control_block:
    positive: { where: "COUNTY_NAME='Sevier'", returnCountOnly: true, expect_count: 70606 }
    negative: { where: "COUNTY_NAME='Zzzznotacounty'", returnCountOnly: true, expect_count: 0 }
  expect:
    # Measured 2026-08-19, minus ~5%.
    per_county_min_rows: { Sevier: 67000, Cocke: 24000, Unicoi: 9700, Johnson: 13400, Carter: 30300 }
    max_zero_parval_pct: 100     # no value field exists at all — see the note above
    rolling_median_floor_pct: 50
    max_delta_pct: 5
  schema_fingerprint: "de595b2161fa8e2de7c3837147639a24e816ed2f173b0d6d09afb024d8223040"
  enabled: true

- id: nc-onemap-points
  # The POINTS sibling of the anchor. NOT a substitute for it: MapServer/1
  # (polygons) is the correct source for attributes and for the geometry that
  # water frontage needs. This layer exists here for ONE job — a cheap x/y per
  # parcel so the map has something to draw. Both are used deliberately; see
  # docs/decisions/0001-polygons-not-points.md for why the distinction bit once.
  kind: arcgis-feature-server
  role: coordinates          # ← the ONLY role permitted to use FeatureServer/0
  url: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/0
  legal_basis: public-records-open-data
  robots:
    verdict: absent            # the host serves no robots.txt (404) — absent, not allow
    checked_at: "2026-08-19"
    evidence_url: https://services.nconemap.gov/robots.txt
    evidence_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  tos: { verdict: permissive, checked_at: "2026-08-19", evidence_url: https://www.nconemap.gov/pages/terms-of-use }
  rate: { rps: 0.5, concurrency: 1, crawl_delay_s: null, backoff: exponential }
  user_agent: "blue-ridge-deal-finder/1.0 (+https://github.com/mcorbett51090/blue-ridge-deal-finder; matt@ravenpower.net)"
  control_block:
    positive: { where: "cntyname='Watauga'", returnCountOnly: true, expect_count: 47388 }
    negative: { where: "cntyname='Zzzznotacounty'", returnCountOnly: true, expect_count: 0 }
  expect:
    # A coordinates source carries no per-county attribute floors: it is joined
    # to the anchor by parno and adds no rows of its own. The anchor's floors
    # already gate the corpus size.
    per_county_min_rows: {}
    max_zero_parval_pct: 100     # not applicable — this layer publishes no value
    rolling_median_floor_pct: 50
    max_delta_pct: 5
  schema_fingerprint: "192750f84fc0dab02275759113a4723c79ababb91e490331d3fa1db157d0b2a1"
  enabled: true

- id: nc-onemap-parcels
  kind: arcgis-map-server

  # ⛔ MapServer/1 is `Parcels (polys)` — esriGeometryPolygon, 71 fields (E6.2).
  # NOT FeatureServer/0, which is `Parcels (pts)` and cannot answer three of the
  # five deal signals (stream crossing, frontage length, floodplain fraction).
  # See docs/decisions/0001-polygons-not-points.md. A gate greps for the point
  # layer's path and fails if it ever appears in this file.
  url: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/MapServer/1

  legal_basis: public-records-open-data

  # ⛔ MEASURED 2026-08-19: GET /robots.txt answers HTTP 404 with a static IIS
  # error page. There IS NO robots.txt on this host, so the honest verdict is
  # `absent`, not the `allow` P0's candidates file recorded — nobody granted
  # anything, there is simply no file to grant it. Permission-wise the guard
  # treats the two identically; this is a truthfulness correction.
  #
  # `evidence_sha256` is the digest of the DIRECTIVE TEXT, and for a non-2xx
  # response that text is the empty string — which is exactly what
  # pipeline/fetch/client.ts hashes (`res.ok ? await res.text() : ''`). Any
  # other value here makes the CE-4 drift check fire on every single run.
  # The 404 body itself and its own digest are cached beside the metadata file
  # so 'absent' is auditable rather than asserted; see
  # sources/evidence/robots/services.nconemap.gov.json.
  # If this host ever PUBLISHES a robots.txt the digest changes and the source
  # moves to ingest_paused — stop new ingest, keep serving last-known-good.
  robots:
    verdict: absent                # allow | disallow | absent | unreachable
    checked_at: "2026-08-19"
    evidence_url: https://services.nconemap.gov/robots.txt
    evidence_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

  tos:
    verdict: permissive            # permissive | restrictive | prohibitive | unknown
    checked_at: "2026-08-19"
    evidence_url: https://www.nconemap.gov/pages/terms

  rate:
    rps: 0.5
    concurrency: 1
    crawl_delay_s: null            # honoured LITERALLY when robots.txt states one
    backoff: exponential

  # Honest UA. Never a browser string; never contains bot/AI/Claude/GPT.
  # docs/decisions/0003-honest-ua.md records the judgment call and its tension.
  user_agent: "blue-ridge-deal-finder/1.0 (+https://github.com/mcorbett51090/blue-ridge-deal-finder; matt@ravenpower.net)"

  # RT-1 — asserted EVERY batch, not once at setup. The two bodies must DIFFER.
  # A batch whose positive control misses its count is a FAILED run, not a clean
  # one: a `/secure/` endpoint that no longer exists answers HTTP 200 with an
  # in-band error body, and `undefined < 45000` is `false`.
  control_block:
    positive:
      where: "cntyname='Watauga'"
      returnCountOnly: true
      expect_count: 47388
    negative:
      where: "cntyname='Zzzznotacounty'"
      returnCountOnly: true
      expect_count: 0

  expect:
    # MEASURED (E2.7) minus ~5%. Guessed floors do not catch a fake failover;
    # these would have caught the 866-row mirror instantly.
    per_county_min_rows:
      Watauga: 45000
      Buncombe: 128000
      Henderson: 71000
      Haywood: 50000
      Jackson: 39000
      Ashe: 36000
      Transylvania: 30000
      Avery: 23000
      Madison: 20000
      Mitchell: 16500
      Yancey: 16500
    rolling_median_floor_pct: 50   # moving floor, on top of the static one
    max_delta_pct: 5
    max_zero_parval_pct: 4         # RT-3 value-distribution gate (1.7% measured, Watauga)

  # sha256 over the CANONICAL schema — field name:type sorted, plus geometryType,
  # maxRecordCount and the OID field name. Deliberately NOT over the whole 12,387
  # byte body: ~55 of its 60 keys are presentation (drawingInfo, extent,
  # serviceItemId, currentVersion), and a fingerprint that goes red on a symbology
  # edit gets its constant bumped without anyone reading the diff — a gate
  # disabled while still appearing to run.
  # Computed by pipeline/fetch/schema-fingerprint.ts from the body cached at
  # sources/evidence/schema/nc-onemap-parcels.MapServer-1.f-json.json (12,387 B,
  # 71 fields, esriGeometryPolygon, maxRecordCount 5000, OID field `objectid`).
  # It is asserted against a FRESH `?f=json` BEFORE any data query; a mismatch
  # aborts the run and ingests nothing.
  schema_fingerprint: "f84a78b7ff4ed2d2dbd49c23007c82d931bc01d80173149f66c245732da5dc86"
  enabled: true                    # ← flipped at P2, in the same commit as the digests
